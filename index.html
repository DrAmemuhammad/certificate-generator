<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Generator</title>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
}

h1 {
  margin-bottom: 10px;
}

input {
  width: 90%;
  padding: 14px;
  font-size: 18px;
  margin: 15px 0;
  border: 1px solid #aaa;
  border-radius: 8px;
}

button {
  padding: 13px 20px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  background: #17446b;
  color: white;
  font-size: 16px;
}

#message {
  margin-top: 15px;
  color: #555;
}
</style>
</head>

<body>

<div class="container">

<h1>Certificate Generator</h1>

<p>Rubuta sunan ɗalibi:</p>

<input
  type="text"
  id="studentName"
  placeholder="Sunan ɗalibi..."
>

<br>

<button onclick="generateCertificate()">
Generate Certificate
</button>

<button onclick="downloadCertificate()">
Download Certificate
</button>

<p id="message"></p>

</div>

<script>

let finalPDF = null;

async function generateCertificate() {

  const name = document
    .getElementById("studentName")
    .value
    .trim();

  const message =
    document.getElementById("message");

  if (!name) {
    message.textContent =
      "Da fatan ka rubuta sunan ɗalibi.";
    return;
  }

  message.textContent =
    "Ana ƙirƙirar certificate...";

  try {

    const response = await fetch(
      "./modern_arabic_certificate_landscape.pdf"
    );

    if (!response.ok) {
      throw new Error(
        "Ba a samu PDF ɗin certificate ba."
      );
    }

    const pdfBytes =
      await response.arrayBuffer();

    const pdfDoc =
      await PDFLib.PDFDocument.load(pdfBytes);

    const pages =
      pdfDoc.getPages();

    const page = pages[0];

    const { width, height } =
      page.getSize();

    const font =
      await pdfDoc.embedFont(
        PDFLib.StandardFonts.HelveticaBold
      );

    const fontSize = 30;

    const textWidth =
      font.widthOfTextAtSize(
        name,
        fontSize
      );

    const x =
      (width - textWidth) / 2;

    const y =
      height / 2;

    page.drawText(name, {
      x: x,
      y: y,
      size: fontSize,
      font: font,
      color: PDFLib.rgb(0.1, 0.2, 0.3)
    });

    finalPDF =
      await pdfDoc.save();

    message.textContent =
      "An shirya certificate. ✅";

  } catch (error) {

    console.error(error);

    message.textContent =
      "An samu matsala: " +
      error.message;
  }
}


function downloadCertificate() {

  if (!finalPDF) {

    alert(
      "Da farko danna Generate Certificate."
    );

    return;
  }

  const blob =
    new Blob(
      [finalPDF],
      { type: "application/pdf" }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  const name =
    document
      .getElementById("studentName")
      .value
      .trim();

  link.href = url;

  link.download =
    "Certificate-" +
    name +
    ".pdf";

  document.body.appendChild(link);

  link.click();

  link.remove();

  URL.revokeObjectURL(url);
}

</script>

</body>
</html>
