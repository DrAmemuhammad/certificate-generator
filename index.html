<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificate Generator</title>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f1f3f5;
}

.container {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 25px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  margin-top: 0;
}

.subtitle {
  text-align: center;
  color: #666;
}

.controls {
  display: flex;
  gap: 10px;
  margin: 20px 0;
  flex-wrap: wrap;
}

input {
  flex: 1;
  min-width: 230px;
  padding: 14px;
  font-size: 18px;
  border: 1px solid #aaa;
  border-radius: 8px;
}

button {
  padding: 14px 20px;
  border: none;
  border-radius: 8px;
  background: #17446b;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

.preview {
  margin-top: 20px;
  background: #ddd;
  padding: 10px;
  text-align: center;
}

iframe {
  width: 100%;
  height: 500px;
  border: none;
  background: white;
}

.note {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>Certificate Generator</h1>

<p class="subtitle">
Rubuta sunan ɗalibi sannan ka danna Generate Certificate.
</p>

<div class="controls">

<input
  type="text"
  id="studentName"
  placeholder="Sunan ɗalibi..."
>

<button onclick="generateCertificate()">
Generate Certificate
</button>

<button onclick="downloadCertificate()">
Download Certificate
</button>

</div>

<div class="preview">
  <iframe id="preview"></iframe>
</div>

<p class="note">
Certificate Generator — Tarbiyatul Auladul Islam
</p>

</div>

<script>

let generatedPDF = null;

async function generateCertificate() {

  const name = document.getElementById("studentName").value.trim();

  if (!name) {
    alert("Da fatan ka rubuta sunan ɗalibi.");
    return;
  }

  try {

    const response = await fetch(
      "modern_arabic_certificate_landscape.pdf"
    );

    const existingPdfBytes = await response.arrayBuffer();

    const pdfDoc = await PDFLib.PDFDocument.load(
      existingPdfBytes
    );

    const pages = pdfDoc.getPages();

    const page = pages[0];

    const { width, height } = page.getSize();

    const font = await pdfDoc.embedFont(
      PDFLib.StandardFonts.HelveticaBold
    );

    const fontSize = 30;

    const textWidth = font.widthOfTextAtSize(
      name,
      fontSize
    );

    const x = (width - textWidth) / 2;

    /*
      Wannan shi ne wurin sunan.
      Idan sunan ya fito sama ko ƙasa,
      za mu gyara wannan value.
    */

    const y = height / 2;

    page.drawText(name, {

      x: x,
      y: y,

      size: fontSize,

      font: font,

      color: PDFLib.rgb(
        0.10,
        0.20,
        0.30
      )

    });

    generatedPDF = await pdfDoc.save();

    const blob = new Blob(
      [generatedPDF],
      { type: "application/pdf" }
    );

    const url = URL.createObjectURL(blob);

    document.getElementById("preview").src = url;

  } catch (error) {

    console.error(error);

    alert(
      "An samu matsala wajen ƙirƙirar certificate."
    );

  }
}


function downloadCertificate() {

  if (!generatedPDF) {

    alert(
      "Da farko danna Generate Certificate."
    );

    return;
  }

  const blob = new Blob(
    [generatedPDF],
    { type: "application/pdf" }
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;

  link.download =
    "Certificate-" +
    document.getElementById("studentName").value +
    ".pdf";

  link.click();

  URL.revokeObjectURL(url);
}

</script>

</body>
  </html>
